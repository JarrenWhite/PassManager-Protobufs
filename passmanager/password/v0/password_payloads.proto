syntax = "proto3";

package passmanager.password.v0;

message PasswordStartRequest {
  bytes username_hash = 1;
  bytes srp_salt = 2;
  bytes srp_verifier = 3;
  bytes master_key_salt = 4;
}

message PasswordStartResponse {
  bytes username_hash = 1;
  string auth_id = 2;
  bytes srp_salt = 3;
  bytes eph_public_b = 4;
}
